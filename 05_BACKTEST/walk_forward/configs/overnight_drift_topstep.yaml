# Configuracao do Walk-Forward para EstrategiaOvernightDrift.
#
# Hipotese (Cooper-Cliff-Gulen 2008): ~100% do retorno medio de
# acoes americanas vem do periodo overnight (close-to-open). RTH
# (open-to-close) e levemente negativo em media. Strategia long-flat:
# compra no close 21:00 UTC, vende na abertura 14:30 UTC do proximo
# dia util. Pula sextas (weekend holding viola modelo).
#
# Edge bruto esperado: ~50 pts/trade × 250 trades/ano = 12k pts/ano
# bruto. Friccao Topstep ~2.5 pts/trade × 250 = 625 pts = 5% bruto.
# Pela regra ouro do sweep (edge bruto >= 5 pts/trade), DEVE sobreviver.

tamanho_treino_dias_uteis: 60
tamanho_teste_dias_uteis: 60
granularidade: 1m
seed: 42
custos:
  slippage_pontos_por_lado: 0.25
  comissao_usd_por_contrato_por_lado: 0.62
  usd_por_ponto: 2.0
  slippage_fracao_range: 0.075
