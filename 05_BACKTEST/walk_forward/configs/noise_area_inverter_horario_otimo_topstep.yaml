# Variante "mean-reversion + filtro horario" da Noise Area.
#
# Hipotese: a friccao no MNQ varia ao longo do dia. Caracterizacao
# tick (commit anterior) mostrou:
# - h=14h UTC: spread mediano 0.41 pts (RTH abertura)
# - h=18h UTC: spread mediano 0.39 pts (mais liquido do dia)
# - h=20h UTC: spread sobe para 0.55 pts (proximidade do close + thin)
# - h=21h UTC e overnight: spread > 0.55 pts
#
# Sessao restrita 14:30-19:00 UTC (4.5h vs 6.5h padrao) elimina os
# 30min finais e a hora 20h-21h (que o lockout original ja cobre, mas
# reforca). Esperamos:
# - Menos trades total (sessao menor)
# - Friccao menor por trade (horario de pico de liquidez)
# - Sharpe mediano possivelmente menos negativo

tamanho_treino_dias_uteis: 60
tamanho_teste_dias_uteis: 60
granularidade: 1m
seed: 42
custos:
  slippage_pontos_por_lado: 0.25
  comissao_usd_por_contrato_por_lado: 0.62
  usd_por_ponto: 2.0
  slippage_fracao_range: 0.075
