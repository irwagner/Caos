# Configuracao do Walk-Forward para EstrategiaPreFomcDrift com slippage
# PROPORCIONAL ao range do trade (modelo Hydra v1, mediana 7.5% do
# range de referencia + comissao Topstep).
#
# Revalidacao motivada pelo estudo dos robos de referencia (commit
# c1b2bc6 + estudo-robos-referencia-2026-05-23). Hydra v1 mostrou que
# slippage fixo subestima o custo real em backtests.

tamanho_treino_dias_uteis: 60
tamanho_teste_dias_uteis: 60
granularidade: 1m
seed: 42
custos:
  slippage_pontos_por_lado: 0.25     # piso minimo (1 tick MNQ)
  slippage_fracao_range: 0.075       # mediana Hydra v1 (40 trades NT8 reais)
  comissao_usd_por_contrato_por_lado: 0.62
  usd_por_ponto: 2.0
